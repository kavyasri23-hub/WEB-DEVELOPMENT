<!DOCTYPE html>
<html lang="en"

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Dice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <div class="header">
            <p class="small-title">ARCADE GAME</p>
            <h1>NEON DICE</h1>
            <p class="subtitle">Roll your luck 🎲</p>
        </div>

        <div class="dice-area">

            <div class="dice" id="dice">

                <span class="dot dot1"></span>
                <span class="dot dot2"></span>
                <span class="dot dot3"></span>
                <span class="dot dot4"></span>
                <span class="dot dot5"></span>
                <span class="dot dot6"></span>
                <span class="dot dot7"></span>
                <span class="dot dot8"></span>
                <span class="dot dot9"></span>

            </div>

        </div>

        <div class="result" id="result">
            Ready?
        </div>

        <button id="rollButton">
            ROLL DICE
        </button>

        <div class="info">

            <div>
                <span>ROLLS</span>
                <strong id="
                rollCount">0</strong>
            </div>

            <div>
                <span>LAST ROLL</span>
                <strong id="lastRoll">-</strong>
            </div>

        </div>

        <p class="keyboard">
            Press <b>SPACE</b> to roll
        </p>

    </div>

    <script src="script.js"></script>

</head>
</body>

</html>
